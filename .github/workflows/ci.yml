name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Static and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install ruff==0.4.10 coverage==7.14.1
      - name: Lint Python
        run: ruff check .
      - name: Measure branch coverage
        run: |
          coverage run --branch -m unittest discover -s tests
          coverage report --fail-under=70
      - name: Validate release metadata
        run: python scripts/validate_release.py

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources
        run: >-
          python -m py_compile install.py uninstall.py
          scripts/dekyon_worker.py scripts/session_end.py
          scripts/session_start_context.py scripts/validate_release.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
      - name: Check POSIX wrapper syntax
        if: runner.os != 'Windows'
        run: sh -n bin/dekyon-codex

  package:
    name: Validate plugin and skill packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate Claude Code plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.63 plugin validate .
      - name: Verify skills CLI discovery
        run: npx --yes skills@1.5.22 add . --list
