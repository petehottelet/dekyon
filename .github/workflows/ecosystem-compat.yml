name: Ecosystem compatibility

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Current Claude Code and skills CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate with current Claude Code
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
      - name: Verify current skills CLI discovery
        run: npx --yes skills@latest add . --list
